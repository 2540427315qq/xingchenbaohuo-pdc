services:
  teleagent-dashboard:
    build: .
    container_name: teleagent-dashboard
    restart: unless-stopped
    ports:
      - "8590:8590"
    environment:
      - TZ=Asia/Shanghai
      - PORT=8590
      # 关键：远程部署模式——重启功能自动禁用（shutdown 只会作用于部署机而非云电脑）
      - TA_MODE=remote
    volumes:
      - ./data:/app/data
      # 鉴权：页面「账号登录」输入手机号+密码，JWT 自动写入 data/jwt.txt 并自动续期

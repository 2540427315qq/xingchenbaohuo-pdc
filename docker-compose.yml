services:
  teleagent-dashboard:
    build: .
    container_name: teleagent-dashboard
    restart: unless-stopped
    ports:
      - "8590:8590"
    environment:
      - TZ=Asia/Shanghai
      - PORT=8590
      - TA_TOKEN_FILE=/app/data/jwt.txt
      # 关键：远程部署模式——重启功能自动禁用（shutdown 只会作用于部署机而非云电脑）
      - TA_MODE=remote
    volumes:
      - ./data:/app/data
      # JWT 获取方式：在源云电脑上运行导出命令（见 README），把生成的 jwt.txt 放到本目录 data/ 下
